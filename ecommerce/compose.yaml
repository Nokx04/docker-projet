version: '3.9'

services:
  # ============ BASES DE DONNÉES ============
  
  db-users:
    image: postgres:14-alpine
    container_name: db-users
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: useruser
      POSTGRES_PASSWORD: userpass123
    ports:
      - "5431:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
      - ./users-service/database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U useruser"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-products:
    image: postgres:14-alpine
    container_name: db-products
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: produser
      POSTGRES_PASSWORD: prodpass123
    ports:
      - "5432:5432"
    volumes:
      - products-db-data:/var/lib/postgresql/data
      - ./products-service/database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U produser"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-orders:
    image: postgres:14-alpine
    container_name: db-orders
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: orduser
      POSTGRES_PASSWORD: ordpass123
    ports:
      - "5433:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql/data
      - ./orders-service/database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orduser"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============ SERVICES MÉTIER ============


  users-api:
    build:
      context: ./users-service
      dockerfile: Dockerfile
    container_name: users-api
    ports:
      - "5001:3000"
    environment:
      DATABASE_URL: postgresql://useruser:userpass123@db-users:5432/users_db
      NODE_ENV: development
    depends_on:
      db-users:
        condition: service_healthy
    networks:
      - ecommerce-network
    volumes:
      - ./users-service:/app

  products-api:
    build:
      context: ./products-service
      dockerfile: Dockerfile
    container_name: products-api
    ports:
      - "5002:3000"
    environment:
      DATABASE_URL: postgresql://produser:prodpass123@db-products:5432/products_db
      NODE_ENV: development
    depends_on:
      db-products:
        condition: service_healthy
    networks:
      - ecommerce-network
    volumes:
      - ./products-service:/app

  orders-api:
    build:
      context: ./orders-service
      dockerfile: Dockerfile
    container_name: orders-api
    ports:
      - "5003:3000"
    environment:
      DATABASE_URL: postgresql://orduser:ordpass123@db-orders:5432/orders_db
      PRODUCTS_API_URL: http://products-api:3000
      USERS_API_URL: http://users-api:3000
      NODE_ENV: development
    depends_on:
      db-orders:
        condition: service_healthy
      products-api:
        condition: service_started
    networks:
      - ecommerce-network
    volumes:
      - ./orders-service:/app

  # ============ API GATEWAY ============

  nginx:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - users-api
      - products-api
      - orders-api
    networks:
      - ecommerce-network

volumes:
  users-db-data:
  products-db-data:
  orders-db-data:

networks:
  ecommerce-network:
    driver: bridge