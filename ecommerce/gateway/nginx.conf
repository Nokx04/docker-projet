events {}

http {
    server {
        listen 80;

        # Users service
        location /api/users/ {
            proxy_pass http://users-service:5001/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Optionnel: timeouts pour éviter blocage
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
}